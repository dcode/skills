# Install once with: uv run pre-commit install
# Refresh the pinned revisions with: uv run pre-commit autoupdate
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.5
    hooks:
      - id: rumdl-check
      - id: rumdl-fmt

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        # Syntax-only: taplo cannot parse the current online schema catalog, and
        # skipping it keeps the hook working without network access.
        args: [--no-schema]

  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
