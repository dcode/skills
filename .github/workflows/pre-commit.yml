name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so pin an exact release.
      - uses: astral-sh/setup-uv@v10.3.3

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Same hooks as local commits: rumdl, shellcheck, and scripts/validate_skills.py.
      - run: uvx pre-commit run --all-files --show-diff-on-failure --color always
